name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install --quiet pytest ruff
      - run: ruff check .
      # Offline unit tests only; the PDF/OCR checks run in link-check.yml.
      - run: pytest -q
